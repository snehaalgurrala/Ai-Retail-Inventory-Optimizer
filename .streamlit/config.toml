# Bunzl enterprise light theme. Locked to light so the white/navy/green look is
# consistent for every viewer regardless of OS preference. Tokens mirror the
# palette in frontend/components/theme.py (PRIMARY_NAVY / ACCENT_GREEN / BORDER).
[theme]
base = "light"
primaryColor = "#183F5F"
font = "sans serif"
baseRadius = "0.85rem"
buttonRadius = "0.7rem"
showWidgetBorder = true
showSidebarBorder = true

backgroundColor = "#F5F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0A1F33"
borderColor = "#D8E2EC"
linkColor = "#183F5F"
codeBackgroundColor = "#EAF1F7"
# The native dataframe grid is canvas-rendered and draws header text in a faded
# body-text color (no header-text-color option exists), so a dark navy header
# would render faded-dark-on-dark and be unreadable. A light navy-tinted header
# keeps the Bunzl look while staying high-contrast and clearly visible.
dataframeHeaderBackgroundColor = "#EAF1F7"
dataframeBorderColor = "#D8E2EC"
